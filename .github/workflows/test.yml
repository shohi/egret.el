name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['31.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Go tree-sitter grammar
        run: |
          emacs -Q --batch --eval "
          (progn
            (require 'treesit)
            (add-to-list 'treesit-language-source-alist
                         '(go \"https://github.com/tree-sitter/tree-sitter-go\"))
            (treesit-install-language-grammar 'go))"

      - name: Byte-compile
        run: |
          emacs -Q --batch -L . -f batch-byte-compile egret.el

      - name: Run ERT tests
        run: |
          emacs -Q --batch -L . -l ert -l egret.el \
            $(for f in test/egret-*-test.el; do echo -l "$f"; done) \
            -f ert-run-tests-batch-and-exit
